name: LYA native body Qt checks
on:
  push:
    branches:
      - codex/lya-visual-prototype-20261013
    paths:
      - 'desktop/**'
      - 'visual creativity/**'
      - '.github/workflows/native-body-qt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-body:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime
        run: python -m pip install --disable-pip-version-check "PySide6==6.8.3"
      - name: Test real Qt widget without assistant services
        run: python desktop/check_body_qt.py
