name: LYA glass conversation checks
on:
  push:
    branches: [codex/lya-glass-conversation-20261016]
    paths: ['desktop/**', 'brain/workflow.py', 'skills/limited_apps.py', '.github/workflows/glass-conversation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-ui:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing native UI dependency
        run: python -m pip install --disable-pip-version-check "PySide6-Essentials==6.11.2" cryptography pywin32
      - name: Existing isolated workflow and research checks
        run: python -m unittest test_brain_workflow test_research_adapter -q
      - name: Isolated task and conversation checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: python desktop/check_glass.py
      - name: Native Windows target and click-through styles
        env:
          QT_QPA_PLATFORM: windows
        run: python desktop/check_glass_windows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lya-glass-native-preview
          path: |
            review/2026-10-16-glass-conversation/*.png
            desktop/assets/lya-reference-body.png
