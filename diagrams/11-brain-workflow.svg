<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#638f9b"/></marker></defs><rect width="1400" height="1040" fill="#0b1821"/><text x="60" y="65" fill="#81bac8" font-family="Segoe UI, sans-serif" font-size="17">LYA / A BRAIN WITH BOUNDARIES</text><text x="60" y="114" fill="#f3f8fa" font-family="Segoe UI, sans-serif" font-size="38">How LYA prepares an answer</text><rect x="60" y="160" width="390" height="150" rx="16" fill="#142933" stroke="#70d4dd" stroke-opacity=".65"/><text x="82" y="196" fill="#70d4dd" font-family="Segoe UI, sans-serif" font-size="23">1  Your request</text><text x="82" y="230" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Typed text or a forwarded utterance</text><text x="82" y="257" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Classify the requested operation</text><text x="82" y="284" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Color never establishes identity</text><rect x="505" y="160" width="390" height="150" rx="16" fill="#142933" stroke="#70d4dd" stroke-opacity=".65"/><text x="527" y="196" fill="#70d4dd" font-family="Segoe UI, sans-serif" font-size="23">2  Identity + permission</text><text x="527" y="230" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Active person ID and expiry</text><text x="527" y="257" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Exact-request approval for private work</text><text x="527" y="284" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Unknown person stays a guest</text><rect x="950" y="160" width="390" height="150" rx="16" fill="#142933" stroke="#70d4dd" stroke-opacity=".65"/><text x="972" y="196" fill="#70d4dd" font-family="Segoe UI, sans-serif" font-size="23">3  Relevant context</text><text x="972" y="230" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Only that person’s active notes</text><text x="972" y="257" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Sources, revisions and linked notes</text><text x="972" y="284" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Credentials excluded</text><path d="M452 235 L493 235" stroke="#638f9b" stroke-width="2" marker-end="url(#arrow)"/><path d="M897 235 L938 235" stroke="#638f9b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1145 312 L1145 365" stroke="#638f9b" stroke-width="2" marker-end="url(#arrow)"/><rect x="950" y="380" width="390" height="160" rx="16" fill="#142933" stroke="#70d4dd" stroke-opacity=".65"/><text x="972" y="416" fill="#70d4dd" font-family="Segoe UI, sans-serif" font-size="23">4  Reason / council</text><text x="972" y="450" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Ordinary: one model request</text><text x="972" y="477" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Important: reviewer, planner, critic</text><text x="972" y="504" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Then a synthesis; at most four calls</text><rect x="505" y="380" width="390" height="160" rx="16" fill="#142933" stroke="#70d4dd" stroke-opacity=".65"/><text x="527" y="416" fill="#70d4dd" font-family="Segoe UI, sans-serif" font-size="23">5  Check before showing</text><text x="527" y="450" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Identity still valid? Context expired?</text><text x="527" y="477" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Was the operation cancelled?</text><text x="527" y="504" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Agreement is not verification</text><rect x="60" y="380" width="390" height="160" rx="16" fill="#142933" stroke="#70d4dd" stroke-opacity=".65"/><text x="82" y="416" fill="#70d4dd" font-family="Segoe UI, sans-serif" font-size="23">6  Answer clearly</text><text x="82" y="450" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Recommendation and concise reasons</text><text x="82" y="477" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Saved-context references and uncertainty</text><text x="82" y="504" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Generated claims are not auto-saved</text><path d="M948 458 L907 458" stroke="#638f9b" stroke-width="2" marker-end="url(#arrow)"/><path d="M503 458 L462 458" stroke="#638f9b" stroke-width="2" marker-end="url(#arrow)"/><text x="60" y="597" fill="#f3f8fa" font-family="Segoe UI, sans-serif" font-size="25">Explicit saves take a separate path into memory</text><rect x="60" y="625" width="240" height="145" rx="16" fill="#142933" stroke="#e3bd79" stroke-opacity=".65"/><text x="82" y="661" fill="#e3bd79" font-family="Segoe UI, sans-serif" font-size="23">Temporary</text><text x="82" y="695" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Request context / RAM</text><text x="82" y="722" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Session notes: 15 min idle</text><text x="82" y="749" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Clear on session change</text><rect x="320" y="625" width="240" height="145" rx="16" fill="#142933" stroke="#e3bd79" stroke-opacity=".65"/><text x="342" y="661" fill="#e3bd79" font-family="Segoe UI, sans-serif" font-size="23">Short-term</text><text x="342" y="695" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">7 days by default</text><text x="342" y="722" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Useful recent information</text><text x="342" y="749" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Excluded after expiry</text><rect x="580" y="625" width="240" height="145" rx="16" fill="#142933" stroke="#e3bd79" stroke-opacity=".65"/><text x="602" y="661" fill="#e3bd79" font-family="Segoe UI, sans-serif" font-size="23">Longer-term</text><text x="602" y="695" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">90 days by default</text><text x="602" y="722" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Ongoing projects / lessons</text><text x="602" y="749" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Explicit saved notes</text><rect x="840" y="625" width="240" height="145" rx="16" fill="#142933" stroke="#e3bd79" stroke-opacity=".65"/><text x="862" y="661" fill="#e3bd79" font-family="Segoe UI, sans-serif" font-size="23">Timed</text><text x="862" y="695" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Your exact deadline</text><text x="862" y="722" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Timezone required</text><text x="862" y="749" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Expired notes excluded</text><rect x="1100" y="625" width="240" height="145" rx="16" fill="#142933" stroke="#e3bd79" stroke-opacity=".65"/><text x="1122" y="661" fill="#e3bd79" font-family="Segoe UI, sans-serif" font-size="23">Permanent</text><text x="1122" y="695" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Explicit save only</text><text x="1122" y="722" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">No automatic expiry</text><text x="1122" y="749" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Still correctable / deletable</text><rect x="60" y="805" width="1280" height="125" rx="16" fill="#142933" stroke="#70d4dd" stroke-opacity=".65"/><text x="82" y="841" fill="#70d4dd" font-family="Segoe UI, sans-serif" font-size="23">Small knowledge graph · encrypted SQLite</text><text x="82" y="875" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">LYA plan  — depends_on →  laptop resources       |       Both notes belong to the same person.</text><text x="82" y="902" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Each note: owner · label · value · source · revision · retention · expiry. Forgetting also removes its links.</text><text x="60" y="970" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="17">TESTED: storage, boundaries, expiry, UI dispatch and council orchestration with synthetic fixtures.</text><text x="60" y="1002" fill="#e3bd79" font-family="Segoe UI, sans-serif" font-size="17">PENDING: real identity/phone binding, a reachable model, live evidence research and cloud backup.</text></svg>