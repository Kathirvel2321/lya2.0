<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#638f9b"/></marker></defs><rect width="1400" height="1040" fill="#0b1821"/><text x="60" y="65" fill="#81bac8" font-family="Segoe UI, sans-serif" font-size="20">LYA / STEP 3 + STEP 4</text><text x="60" y="115" fill="#f3f8fa" font-family="Segoe UI, sans-serif" font-size="36">Answer checks and trusted approval</text><rect x="60" y="160" width="390" height="160" rx="16" fill="#142933" stroke="#70d4dd" stroke-opacity=".65"/><text x="82" y="196" fill="#70d4dd" font-family="Segoe UI, sans-serif" font-size="23">1  Typed request</text><text x="82" y="230" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Native UI forwards request</text><text x="82" y="257" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Brain checks session and cancellation</text><text x="82" y="284" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Guest identity does not grant access</text><rect x="505" y="160" width="390" height="160" rx="16" fill="#142933" stroke="#70d4dd" stroke-opacity=".65"/><text x="527" y="196" fill="#70d4dd" font-family="Segoe UI, sans-serif" font-size="23">2  Route the request</text><text x="527" y="230" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Arithmetic: local evaluator</text><text x="527" y="257" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Public: configured cloud route</text><text x="527" y="284" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Private: loopback model or stop</text><rect x="950" y="160" width="390" height="160" rx="16" fill="#142933" stroke="#70d4dd" stroke-opacity=".65"/><text x="972" y="196" fill="#70d4dd" font-family="Segoe UI, sans-serif" font-size="23">3  Answer checks</text><text x="972" y="230" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Research: bounded source snippets</text><text x="972" y="257" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Citations: IDs and lexical screening</text><text x="972" y="284" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Code: proposed / untested label</text><path d="M452 240 L493 240" stroke="#638f9b" stroke-width="2" marker-end="url(#arrow)"/><path d="M897 240 L938 240" stroke="#638f9b" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="390" width="600" height="180" rx="16" fill="#142933" stroke="#e6b35a" stroke-opacity=".65"/><text x="82" y="426" fill="#e6b35a" font-family="Segoe UI, sans-serif" font-size="23">Step 3 evidence and limits</text><text x="82" y="460" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">106 checks passed in the previous recorded suite</text><text x="82" y="487" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">30 synthetic cases: assistant score 143 / 150</text><text x="82" y="514" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Multiple reruns; not an independent quality estimate</text><text x="82" y="541" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Semantic proof and generated-code sandbox remain open</text><rect x="710" y="390" width="630" height="180" rx="16" fill="#142933" stroke="#70d4dd" stroke-opacity=".65"/><text x="732" y="426" fill="#70d4dd" font-family="Segoe UI, sans-serif" font-size="23">4  Present a bounded answer</text><text x="732" y="460" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Recheck cancellation, session and data expiry</text><text x="732" y="487" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Do not auto-save model output as a fact</text><text x="732" y="514" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Keyword privacy routing is not a complete secret detector</text><text x="732" y="541" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Research screening does not prove truth</text><path d="M1145 322 L1145 378" stroke="#638f9b" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="640" width="390" height="185" rx="16" fill="#142933" stroke="#e6b35a" stroke-opacity=".65"/><text x="82" y="676" fill="#e6b35a" font-family="Segoe UI, sans-serif" font-size="23">Step 4A  Challenge</text><text x="82" y="710" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Bind person + session + exact action</text><text x="82" y="737" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Bind exact parameters + random nonce</text><text x="82" y="764" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Short expiry and one-time response</text><text x="82" y="791" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Fake verifier tests; RAM only</text><rect x="505" y="640" width="390" height="185" rx="16" fill="#142933" stroke="#a2b0d3" stroke-opacity=".65"/><text x="527" y="676" fill="#a2b0d3" font-family="Segoe UI, sans-serif" font-size="23">Step 4B  Trusted verifier</text><text x="527" y="710" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Phone / OS authentication required</text><text x="527" y="737" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">No live verifier connected yet</text><text x="527" y="764" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">No automatic face enrollment</text><text x="527" y="791" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Missing adapter: deny access</text><rect x="950" y="640" width="390" height="185" rx="16" fill="#142933" stroke="#e6b35a" stroke-opacity=".65"/><text x="972" y="676" fill="#e6b35a" font-family="Segoe UI, sans-serif" font-size="23">Step 4C  Recheck</text><text x="972" y="710" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Profile still active and same role?</text><text x="972" y="737" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Same session after approval?</text><text x="972" y="764" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Expired or revoked: stop</text><text x="972" y="791" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Then permitted operation only</text><path d="M452 725 L493 725" stroke="#638f9b" stroke-width="2" marker-end="url(#arrow)"/><path d="M897 725 L938 725" stroke="#638f9b" stroke-width="2" marker-end="url(#arrow)"/><text x="60" y="900" fill="#e6b35a" font-family="Segoe UI, sans-serif" font-size="21">Green/current flow | Amber/limited or under test | Slate/pending device integration</text><text x="60" y="950" fill="#f3f8fa" font-family="Segoe UI, sans-serif" font-size="22">No live identity, phone approval or biometric enrollment is claimed.</text></svg>