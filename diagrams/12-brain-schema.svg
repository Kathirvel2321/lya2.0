<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#638f9b"/></marker></defs><rect width="1400" height="1040" fill="#0b1821"/><text x="60" y="65" fill="#81bac8" font-family="Segoe UI, sans-serif" font-size="17">LYA / STORAGE SCHEMA</text><text x="60" y="114" fill="#f3f8fa" font-family="Segoe UI, sans-serif" font-size="37">Ownership first. Relationships second.</text><rect x="60" y="175" width="390" height="275" rx="16" fill="#142933" stroke="#70d4dd" stroke-opacity=".65"/><text x="82" y="211" fill="#70d4dd" font-family="Segoe UI, sans-serif" font-size="23">PEOPLE</text><text x="82" y="245" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">person_id  ·  primary key</text><text x="82" y="272" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">display_name</text><text x="82" y="299" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">role</text><text x="82" y="326" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">active</text><text x="82" y="353" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Owns every personal record</text><rect x="505" y="175" width="390" height="370" rx="16" fill="#142933" stroke="#70d4dd" stroke-opacity=".65"/><text x="527" y="211" fill="#70d4dd" font-family="Segoe UI, sans-serif" font-size="23">MEMORIES</text><text x="527" y="245" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">id  ·  primary key</text><text x="527" y="272" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">person_id  ·  owner</text><text x="527" y="299" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">kind</text><text x="527" y="326" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">key_enc / value_enc</text><text x="527" y="353" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">source / revision</text><text x="527" y="380" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">retention / expires_at</text><text x="527" y="407" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">created_at / updated_at</text><text x="527" y="434" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Nodes of the knowledge graph</text><rect x="950" y="175" width="390" height="275" rx="16" fill="#142933" stroke="#70d4dd" stroke-opacity=".65"/><text x="972" y="211" fill="#70d4dd" font-family="Segoe UI, sans-serif" font-size="23">MEMORY_LINKS</text><text x="972" y="245" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">src  →  memory ID</text><text x="972" y="272" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">dst  →  memory ID</text><text x="972" y="299" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">relation</text><text x="972" y="326" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Same owner, active notes only</text><text x="972" y="353" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Delete note → remove edges</text><path d="M452 280 L493 280" stroke="#638f9b" stroke-width="2" marker-end="url(#arrow)"/><path d="M897 280 L938 280" stroke="#638f9b" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="585" width="390" height="230" rx="16" fill="#142933" stroke="#e3bd79" stroke-opacity=".65"/><text x="82" y="621" fill="#e3bd79" font-family="Segoe UI, sans-serif" font-size="23">FACE_TEMPLATES</text><text x="82" y="655" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">person_id  ·  owner</text><text x="82" y="682" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">embedding_enc</text><text x="82" y="709" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">model_version / quality</text><text x="82" y="736" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Runtime enrollment is deferred</text><path d="M255 452 L255 573" stroke="#638f9b" stroke-width="2" marker-end="url(#arrow)"/><rect x="505" y="585" width="835" height="230" rx="16" fill="#142933" stroke="#e3bd79" stroke-opacity=".65"/><text x="527" y="621" fill="#e3bd79" font-family="Segoe UI, sans-serif" font-size="23">Outside persistent conversational memory</text><text x="527" y="655" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Working context: one request, then discarded.</text><text x="527" y="682" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Session notes: bounded RAM only; never written to SQLite.</text><text x="527" y="709" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Existing pending_faces, vault_items and audit_events remain.</text><text x="527" y="736" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="18">Credentials are not eligible for model context.</text><text x="60" y="882" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="23">One local encrypted database; no separate graph server or vector model is required.</text><text x="60" y="930" fill="#cee3e9" font-family="Segoe UI, sans-serif" font-size="20">Additive migration keeps existing note data and its previous non-expiring behavior.</text><text x="60" y="979" fill="#81bac8" font-family="Segoe UI, sans-serif" font-size="17">Companion overview · detailed validated schema: 12-brain-schema.mmd</text></svg>