  <text x="790" y="866" class="head">STATUS LEGEND</text>
  <rect x="790" y="889" width="22" height="22" class="green"/><text x="823" y="906" class="body">Verified in T01</text>
  <rect x="1005" y="889" width="22" height="22" class="amber"/><text x="1038" y="906" class="body">Earlier live evidence</text>
  <rect x="1260" y="889" width="22" height="22" class="blue"/><text x="1293" y="906" class="body">Next task</text>
  <rect x="790" y="929" width="22" height="22" class="gray"/><text x="823" y="946" class="body">Pending</text>
  <rect x="1005" y="929" width="22" height="22" class="purple"/><text x="1038" y="946" class="body">Your check</text>
  <rect x="1260" y="929" width="22" height="22" class="red"/><text x="1293" y="946" class="body">Failure path</text>
  <text x="60" y="1000" class="sub">Validated Mermaid source: diagrams/14-t01-working-and-test.mmd · Direct visual companion</text>
