  <rect x="60" y="185" width="650" height="90" class="box green"/>
  <text x="85" y="221" class="head">1 · Native startup</text>
  <text x="85" y="250" class="body">launch-lya.cmd → crystal orb + compact glass panel</text>
  <path d="M385 275V306" class="line"/>

  <rect x="60" y="310" width="305" height="105" class="box green"/>
  <text x="84" y="345" class="head">Local commands</text>
  <text x="84" y="374" class="body">help · status · time</text>
  <text x="84" y="398" class="small">Fast deterministic responses</text>
  <rect x="405" y="310" width="305" height="105" class="box green"/>
  <text x="429" y="345" class="head">Approved files</text>
  <text x="429" y="374" class="body">show files</text>
  <text x="429" y="398" class="small">Four allowlisted project documents</text>
  <path d="M385 275L212 310" class="line"/><path d="M385 275L557 310" class="line"/>

  <rect x="60" y="455" width="650" height="118" class="box green"/>
  <text x="85" y="490" class="head">Brain boundary</text>
  <text x="85" y="520" class="body">brain help · who am i · brain status</text>
  <text x="85" y="548" class="body">Guest remains unverified; private memory is denied</text>
  <path d="M212 415L310 455" class="line"/><path d="M557 415L460 455" class="line"/>

  <rect x="60" y="614" width="305" height="108" class="box green"/>
  <text x="84" y="650" class="head">Lifecycle</text>
  <text x="84" y="679" class="body">stop · sleep · quit</text>
  <text x="84" y="703" class="small">Stale results stay closed</text>
  <rect x="405" y="614" width="305" height="108" class="box amber"/>
  <text x="429" y="650" class="head">Public AI route</text>
  <text x="429" y="679" class="body">Oracle SSH → Groq</text>
  <text x="429" y="703" class="small">Passed earlier; not re-run in T01</text>
  <path d="M385 573L212 614" class="line"/><path d="M385 573L557 614" class="line"/>

  <rect x="60" y="766" width="202" height="93" class="box blue"/>
  <text x="82" y="801" class="head">Next</text><text x="82" y="831" class="body">T02 backup AI</text>
  <rect x="284" y="766" width="202" height="93" class="box gray"/>
  <text x="306" y="801" class="head">Pending</text><text x="306" y="831" class="body">Voice + identity</text>
  <rect x="508" y="766" width="202" height="93" class="box gray"/>
  <text x="530" y="801" class="head">Pending</text><text x="530" y="831" class="body">Phone + recovery</text>
  <path d="M557 722L161 766" class="line"/><path d="M557 722L385 766" class="line dash"/><path d="M557 722L609 766" class="line dash"/>

  <text x="790" y="162" class="head">YOUR TEST FLOW</text>
  <rect x="790" y="185" width="720" height="82" class="box purple"/>
  <text x="818" y="220" class="head">1 · Run .\check-t01.cmd</text>
  <text x="818" y="247" class="body">Expected: PASS · 57 checks passed</text>
  <path d="M1150 267V297" class="line"/>
  <rect x="790" y="301" width="720" height="82" class="box purple"/>
  <text x="818" y="336" class="head">2 · Launch conservative mode</text>
  <text x="818" y="363" class="body">.\launch-lya.cmd --original-art --reduced-motion</text>
  <path d="M1150 383V413" class="line"/>
  <rect x="790" y="417" width="720" height="108" class="box purple"/>
  <text x="818" y="452" class="head">3 · Try the commands</text>
  <text x="818" y="481" class="body">help · status · time · show files · who am i</text>
  <text x="818" y="507" class="small">Expect guest identity; show memories must be blocked</text>
  <path d="M1150 525V555" class="line"/>
  <rect x="790" y="559" width="720" height="96" class="box purple"/>
  <text x="818" y="594" class="head">4 · Test closing behavior</text>
  <text x="818" y="623" class="body">stop → reopen → sleep → Ctrl+Q</text>
  <path d="M1150 655V687" class="line"/>
  <rect x="790" y="691" width="340" height="108" class="box green"/>
  <text x="815" y="730" class="head">PASS</text>
  <text x="815" y="759" class="body">All expected results match</text>
  <text x="815" y="783" class="small">T01 works on this laptop</text>
  <rect x="1170" y="691" width="340" height="108" class="box red"/>
