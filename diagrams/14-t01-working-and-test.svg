<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07141d"/><stop offset="1" stop-color="#111d31"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".32"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#7894a3"/>
    </marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#edf7fb}
      .title{font-size:38px;font-weight:700}.sub{font-size:17px;fill:#99bdca}
      .head{font-size:22px;font-weight:700}.body{font-size:16px;fill:#d8e8ed}
      .box{rx:14;stroke-width:2;filter:url(#shadow)}
      .green{fill:#123d2b;stroke:#6dd39a}.amber{fill:#4b3516;stroke:#e8b761}
      .purple{fill:#302451;stroke:#ad8ee6}.blue{fill:#163c5b;stroke:#6cafdf}
      .gray{fill:#28313d;stroke:#8794a3;stroke-dasharray:7 6}.red{fill:#542029;stroke:#eb7b86}
      .line{fill:none;stroke:#7894a3;stroke-width:2;marker-end:url(#arrow)}
      .dash{stroke-dasharray:7 6}.small{font-size:14px;fill:#bcd0d7}
    </style>
  </defs>
  <rect width="1600" height="1040" fill="url(#bg)"/>
  <text x="60" y="66" class="sub">LYA · VERIFIED BASELINE · 2026-09-16</text>
  <text x="60" y="114" class="title">What works now — and how you test it</text>

